name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK as a prerelease
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_SILENCE_ROOT_WARNING: "1"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT != '' }}  # step conditions cannot read secrets
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Godot and Android templates
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-gradle-desktop

      - name: Install Godot and Android templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Only the templates we export (the full bundle is ~1 GB of other platforms): the two APKs for
          # the sideload build, the Gradle source for the Play bundle, and the three desktop builds.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/version.txt templates/linux_release.x86_64 templates/windows_release_x86_64.exe templates/macos.zip -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Test
        run: GODOT=~/godot/godot tests/run.sh

      - name: Export debug APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          else  # Fork PRs get no secrets: a throwaway key still yields an installable APK.
            keytool -genkeypair -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/zero-gx.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs build/zero-gx.apk | head -3
          unzip -l build/zero-gx.apk | grep -q 'lib/arm64-v8a/libgodot_android.so'
          ls -lh build/zero-gx.apk

      - name: Export Play bundle
        # Signed with the upload key; Play re-signs it for delivery. Fork PRs have no secrets: skip.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/upload.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=upload
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$UPLOAD_KEYSTORE_PASSWORD"
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          # Play needs a higher version code for every upload: the run number always grows.
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          ~/godot/godot --headless --path . --install-android-build-template --export-release "Android Play" build/zero-gx.aab
          jarsigner -verify build/zero-gx.aab
          ls -lh build/zero-gx.aab

      - name: Export desktop builds
        run: |
          ~/godot/godot --headless --path . --export-release "Windows" build/zero-gx-windows.exe
          ~/godot/godot --headless --path . --export-release "Linux" build/zero-gx-linux.x86_64
          ~/godot/godot --headless --path . --export-release "macOS" build/zero-gx-macos.zip
          ls -lh build/zero-gx-windows.exe build/zero-gx-linux.x86_64 build/zero-gx-macos.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-gx-apk
          path: |
            build/zero-gx.apk
            build/zero-gx.aab
            build/zero-gx-windows.exe
            build/zero-gx-linux.x86_64
            build/zero-gx-macos.zip
          if-no-files-found: error

      - name: Publish prerelease
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="prototype-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" build/zero-gx.apk build/zero-gx.aab build/zero-gx-windows.exe build/zero-gx-linux.x86_64 build/zero-gx-macos.zip --target "$GITHUB_SHA" --prerelease \
            --title "Zero-GX prototype r${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Debug-signed prototype build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install: open this page on the phone, download zero-gx.apk, allow installs from the browser, open the file. Later builds install over this one. zero-gx.aab is the signed bundle for Google Play. Desktop builds (Windows, macOS, Linux) are unsigned: on macOS, right-click the app and choose Open; on Windows, choose More info → Run anyway; on Linux, run \`chmod +x\` first."

      - name: Upload to Google Play internal testing
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && env.PLAY_UPLOAD == 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: dev.braitg.zerogx
          releaseFiles: build/zero-gx.aab
          releaseName: r${{ github.run_number }}
          track: internal
          status: completed

      - name: Register official levels with the community server
        # Needs the release tag above, so it runs with the publish step. The token is scoped to this step only; a
        # server outage or a missing secret must not fail the release build.
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && vars.COMMUNITY_API != '' }}
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COMMUNITY_API: ${{ vars.COMMUNITY_API }}
        run: |
          [ -n "$ADMIN_TOKEN" ] || { echo "No ADMIN_TOKEN; skipping."; exit 0; }
          levels=$(sha256sum levels/level_*.json | jq -R -s -c 'split("\n")[:-1] | map(split("  ") | {name: (.[1] | ltrimstr("levels/") | rtrimstr(".json")), sha256: .[0]})')
          jq -n -c --arg release "prototype-r${GITHUB_RUN_NUMBER}" --argjson levels "$levels" '{release: $release, levels: $levels}' > "$RUNNER_TEMP/official.json"
          # The header comes from stdin so the token never appears in the process arguments.
          printf 'Authorization: Bearer %s\n' "$ADMIN_TOKEN" |
            curl --fail-with-body -sS -X POST -H @- -H "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/official.json" "$COMMUNITY_API/admin/official"

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  deploy-server:
    # Deploys the community server after its tests pass on master. Skipped until the repository
    # secret CLOUDFLARE_API_TOKEN exists (see server/README.md).
    needs: server
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          GITHUB_APP_ID: ${{ secrets.LEVELS_APP_ID }}
          GITHUB_APP_KEY: ${{ secrets.LEVELS_APP_KEY }}
          GITHUB_INSTALLATION_ID: ${{ secrets.LEVELS_APP_INSTALLATION_ID }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.LEVELS_WEBHOOK_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN; skipping the deploy."; exit 0; fi
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          scripts/deploy.sh
