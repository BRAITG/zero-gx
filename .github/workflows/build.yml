name: Build

# pull_request: CI runs on every pull request. For pull requests from people without write access
# (forks), GitHub's fork PR approval policy (Settings → Actions → General → "Require approval for all
# external contributors") holds the run until a maintainer clicks "Approve and run" on the PR. Fork
# runs never receive secrets: the debug APK uses a throwaway key and the Play bundle is skipped.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK as a prerelease
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_SILENCE_ROOT_WARNING: "1"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT != '' }}  # step conditions cannot read secrets
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Godot and Android templates
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-gradle-desktop-web-nothreads

      - name: Install Godot and Android templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Only the Android, desktop and Web templates exported below; the full bundle is ~1 GB.
          # The Web template is needed to inspect the free Web package in CI.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/version.txt templates/linux_release.x86_64 templates/windows_release_x86_64.exe templates/macos.zip templates/web_release.zip templates/web_nothreads_debug.zip templates/web_nothreads_release.zip -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Test
        run: GODOT=~/godot/godot tests/run.sh

      - name: Export debug APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          else  # Fork PRs get no secrets: a throwaway key still yields an installable APK.
            keytool -genkeypair -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p build
          android_preflight=$(~/godot/godot --headless --path . --script res://tools/check_monetization_export.gd -- --preset "Android")
          printf '%s\n' "$android_preflight"
          case "$android_preflight" in
            *"Monetization preflight passed for 'Android' (monetization disabled)."*) ;;
            *)
              echo "The ordinary Android export preset must remain monetization-disabled."
              exit 1
              ;;
          esac
          ~/godot/godot --headless --path . --install-android-build-template --export-debug "Android" build/zero-gx.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs build/zero-gx.apk | head -3
          unzip -l build/zero-gx.apk | grep -q 'lib/arm64-v8a/libgodot_android.so'
          # The community plugins and permission must be in the APK: an export that skips a plugin still succeeds.
          unzip -p build/zero-gx.apk 'classes*.dex' | grep -aq 'Ldev/braitg/zerogx/integrity/IntegrityPlugin;'
          unzip -p build/zero-gx.apk 'classes*.dex' | grep -aq 'Lcom/google/android/gms/games/PlayGames;'
          aapt2="${apksigner%/*}/aapt2"
          "$aapt2" dump badging build/zero-gx.apk | grep -q "uses-permission: name='android.permission.INTERNET'"
          "$aapt2" dump xmltree --file AndroidManifest.xml build/zero-gx.apk | grep -q 'com.google.android.gms.games.APP_ID'
          ls -lh build/zero-gx.apk

          # The checked-in Android sideload preset stays free.
          if unzip -p build/zero-gx.apk 'classes*.dex' | grep -aqE 'Ldev/braitg/zerogx/monetization/|Lcom/google/android/libraries/ads/mobile/sdk/|Lcom/google/android/ump/|Lcom/android/billingclient/'; then
            echo "Monetization classes are present in the free sideload APK."
            exit 1
          fi
          if "$aapt2" dump xmltree --file AndroidManifest.xml build/zero-gx.apk | grep -Eq 'com.android.vending.BILLING|com.google.android.gms.permission.AD_ID|com.google.android.gms.ads.APPLICATION_ID|dev.braitg.zerogx.BANNER_UNIT_ID'; then
            echo "Monetization permission or ad metadata is present in the free sideload APK."
            exit 1
          fi

      - name: Build and compare monetization AARs
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          android/build/gradlew -p android/plugins/monetization assembleDebug assembleRelease
          cmp android/plugins/monetization/build/outputs/aar/zero_gx_monetization-debug.aar addons/zero_gx_monetization/bin/zero_gx_monetization-debug.aar
          cmp android/plugins/monetization/build/outputs/aar/zero_gx_monetization-release.aar addons/zero_gx_monetization/bin/zero_gx_monetization-release.aar
          dependencies=$(android/build/gradlew -p android/plugins/monetization dependencies --configuration releaseRuntimeClasspath)
          for pin in \
            'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.6.0' \
            'com.google.android.ump:user-messaging-platform:4.0.0' \
            'com.android.billingclient:billing:9.1.0'; do
            awk -v pin="$pin" '{ for (i = 1; i <= NF; i++) if ($i == pin) found = 1 } END { exit !found }' <<< "$dependencies" || { echo "Missing exact pinned dependency token: $pin"; exit 1; }
            if grep -F "$pin" <<< "$dependencies" | grep -Fq -- ' -> '; then
              echo "Dependency resolved away from pinned version: $pin"
              exit 1
            fi
          done
          if grep -Eq 'com\.google\.android\.gms:play-services-ads(-lite)?(:| )' <<< "$dependencies"; then
            echo "Legacy Google Mobile Ads full/Lite SDK must not be added alongside Next-Gen."
            exit 1
          fi

      - name: Export monetization debug sample APK
        run: |
          backup="$RUNNER_TEMP/export_presets.cfg"
          cp export_presets.cfg "$backup"
          restore_presets() { cp "$backup" export_presets.cfg; }
          trap restore_presets EXIT
          sed -i '/^zero_gx_monetization\/enabled=/d; /^\[preset\.0\.options\]$/a zero_gx_monetization/enabled=true' export_presets.cfg
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          ~/godot/godot --headless --path . --script res://tools/check_monetization_export.gd -- --preset "Android" --debug
          ~/godot/godot --headless --path . --export-debug "Android" build/zero-gx-monetization-test.apk
          dex="$RUNNER_TEMP/monetization-test.dex"
          unzip -p build/zero-gx-monetization-test.apk 'classes*.dex' > "$dex"
          grep -aFq 'Ldev/braitg/zerogx/monetization/MonetizationPlugin;' "$dex"
          grep -aFq 'Lcom/google/android/libraries/ads/mobile/sdk/' "$dex"
          grep -aFq 'Lcom/google/android/ump/' "$dex"
          grep -aFq 'Lcom/android/billingclient/' "$dex"
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml build/zero-gx-monetization-test.apk)
          printf '%s\n' "$manifest" | grep -Fq 'com.android.vending.BILLING'
          printf '%s\n' "$manifest" | grep -Fq 'com.google.android.gms.ads.APPLICATION_ID'
          printf '%s\n' "$manifest" | grep -Fq 'ca-app-pub-3940256099942544~3347511713'
          printf '%s\n' "$manifest" | grep -Fq 'dev.braitg.zerogx.BANNER_UNIT_ID'
          printf '%s\n' "$manifest" | grep -Fq 'ca-app-pub-3940256099942544/9214589741'
          if printf '%s\n' "$manifest" | grep -Fq 'com.google.android.gms.permission.AD_ID'; then
            echo "The enabled debug export retained AD_ID in the merged manifest."
            exit 1
          fi
          rm "$dex"
          restore_presets
          trap - EXIT

      - name: Export Play bundle
        # Signed with the upload key; Play re-signs it for delivery. Fork PRs have no secrets: skip.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/upload.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=upload
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$UPLOAD_KEYSTORE_PASSWORD"
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          # Play needs a higher version code for every upload: the run number always grows.
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          play_preflight=$(~/godot/godot --headless --path . --script res://tools/check_monetization_export.gd -- --preset "Android Play")
          printf '%s\n' "$play_preflight"
          case "$play_preflight" in
            *"Monetization preflight passed for 'Android Play' (monetization disabled)."*) play_monetization=disabled ;;
            *"Monetization preflight passed for 'Android Play' (valid release IDs)."*) play_monetization=enabled ;;
            *)
              echo "The Play preset did not report a valid monetization mode."
              exit 1
              ;;
          esac
          ~/godot/godot --headless --path . --export-release "Android Play" build/zero-gx.aab
          jarsigner -verify build/zero-gx.aab
          unzip -p build/zero-gx.aab 'base/dex/*.dex' | grep -aq 'Ldev/braitg/zerogx/integrity/IntegrityPlugin;'
          unzip -p build/zero-gx.aab 'base/dex/*.dex' | grep -aq 'Lcom/google/android/gms/games/PlayGames;'
          unzip -p build/zero-gx.aab base/manifest/AndroidManifest.xml | grep -aq 'android.permission.INTERNET'
          unzip -p build/zero-gx.aab base/manifest/AndroidManifest.xml | grep -aq 'com.google.android.gms.games.APP_ID'
          if [ "$play_monetization" = enabled ]; then
            unzip -p build/zero-gx.aab 'base/dex/*.dex' | grep -aq 'Ldev/braitg/zerogx/monetization/MonetizationPlugin;'
            dex="$RUNNER_TEMP/monetization-play.dex"
            unzip -p build/zero-gx.aab 'base/dex/*.dex' > "$dex"
            grep -aFq 'Lcom/google/android/libraries/ads/mobile/sdk/' "$dex"
            grep -aFq 'Lcom/google/android/ump/' "$dex"
            grep -aFq 'Lcom/android/billingclient/' "$dex"
            manifest=$(unzip -p build/zero-gx.aab base/manifest/AndroidManifest.xml | strings -a)
            printf '%s\n' "$manifest" | grep -Fq 'com.android.vending.BILLING'
            printf '%s\n' "$manifest" | grep -Fq 'com.google.android.gms.ads.APPLICATION_ID'
            printf '%s\n' "$manifest" | grep -Fq 'dev.braitg.zerogx.BANNER_UNIT_ID'
            if printf '%s\n' "$manifest" | grep -Fq 'com.google.android.gms.permission.AD_ID'; then
              echo "The enabled Play bundle retained AD_ID in the merged manifest."
              exit 1
            fi
            rm "$dex"
          else
            if unzip -p build/zero-gx.aab 'base/dex/*.dex' | grep -aqE 'Ldev/braitg/zerogx/monetization/MonetizationPlugin;|Lcom/google/android/libraries/ads/mobile/sdk/|Lcom/google/android/ump/|Lcom/android/billingclient/'; then
              echo "Monetization plugin/SDK classes are present in the disabled Play bundle."
              exit 1
            fi
            if unzip -p build/zero-gx.aab base/manifest/AndroidManifest.xml | strings -a | grep -aqE 'com.android.vending.BILLING|com.google.android.gms.permission.AD_ID|com.google.android.gms.ads.APPLICATION_ID|dev.braitg.zerogx.BANNER_UNIT_ID'; then
              echo "Monetization permission or ad metadata is present in the disabled Play bundle."
              exit 1
            fi
          fi
          ls -lh build/zero-gx.aab

      - name: Export desktop builds
        run: |
          ~/godot/godot --headless --path . --export-release "Windows" build/zero-gx-windows.exe
          ~/godot/godot --headless --path . --export-release "Linux" build/zero-gx-linux.x86_64
          ~/godot/godot --headless --path . --export-release "macOS" build/zero-gx-macos.zip
          ls -lh build/zero-gx-windows.exe build/zero-gx-linux.x86_64 build/zero-gx-macos.zip
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.pck
          # Android AARs and Worker package/dependency files must not be in any free desktop/Web PCK.
          for binary in build/zero-gx-windows.exe build/zero-gx-linux.x86_64 build/web/index.pck; do
            if strings -a "$binary" | grep -Eiq '\.aar|server/(package\.json|node_modules)'; then
              echo "Android or Worker packaging files are present in $binary."
              exit 1
            fi
          done
          if unzip -p build/zero-gx-macos.zip '*/Zero-GX.pck' | strings -a | grep -Eiq '\.aar|server/(package\.json|node_modules)'; then
            echo "Android or Worker packaging files are present in the macOS PCK."
            exit 1
          fi
          # The plugins' Android libraries belong to Android builds only.
          if unzip -p build/zero-gx-macos.zip '*/Zero-GX.pck' | strings -a | grep -qi '\.aar'; then echo "An AAR is in the macOS build."; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-gx-apk
          path: |
            build/zero-gx.apk
            build/zero-gx.aab
            build/zero-gx-windows.exe
            build/zero-gx-linux.x86_64
            build/zero-gx-macos.zip
            build/web/
          if-no-files-found: error

      - name: Publish prerelease
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="prototype-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" build/zero-gx.apk build/zero-gx.aab build/zero-gx-windows.exe build/zero-gx-linux.x86_64 build/zero-gx-macos.zip --target "$GITHUB_SHA" --prerelease \
            --title "Zero-GX prototype r${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Debug-signed prototype build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install: open this page on the phone, download zero-gx.apk, allow installs from the browser, open the file. Later builds install over this one. zero-gx.aab is the signed bundle for Google Play. Desktop builds (Windows, macOS, Linux) are unsigned: on macOS, open System Settings → Privacy & Security and choose Open Anyway (macOS 15 and later; on older versions, right-click the app and choose Open); on Windows, choose More info → Run anyway; on Linux, run \`chmod +x\` first."

      - name: Upload to Google Play internal testing
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && env.PLAY_UPLOAD == 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: dev.braitg.zerogx
          releaseFiles: build/zero-gx.aab
          releaseName: r${{ github.run_number }}
          tracks: internal
          status: completed

      - name: Register official levels with the community server
        # Needs the release tag above, so it runs with the publish step. The token is scoped to this step only; a
        # server outage or a missing secret must not fail the release build.
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && vars.COMMUNITY_API != '' }}
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COMMUNITY_API: ${{ vars.COMMUNITY_API }}
        run: |
          [ -n "$ADMIN_TOKEN" ] || { echo "No ADMIN_TOKEN; skipping."; exit 0; }
          levels=$(sha256sum levels/level_*.json | jq -R -s -c 'split("\n")[:-1] | map(split("  ") | {name: (.[1] | ltrimstr("levels/") | rtrimstr(".json")), sha256: .[0]})')
          jq -n -c --arg release "prototype-r${GITHUB_RUN_NUMBER}" --argjson levels "$levels" '{release: $release, levels: $levels}' > "$RUNNER_TEMP/official.json"
          # The header comes from stdin so the token never appears in the process arguments.
          printf 'Authorization: Bearer %s\n' "$ADMIN_TOKEN" |
            curl --fail-with-body -sS -X POST -H @- -H "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/official.json" "$COMMUNITY_API/admin/official"

  graph:
    # The committed code graph must equal a rebuild with the pinned Graphify build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check that graphify-out/graph.json is fresh
        run: |
          sh tools/ensure-graphify.sh
          git show HEAD:graphify-out/graph.json > "$RUNNER_TEMP/graph-committed.json"
          PYTHONHASHSEED=0 graphify update .
          if ! git diff --quiet -- graphify-out/graph.json; then
            echo "::error::graphify-out/graph.json is stale; bounded node/edge delta follows."
            git diff --stat -- graphify-out/graph.json
            jq -n \
              --slurpfile committed "$RUNNER_TEMP/graph-committed.json" \
              --slurpfile rebuilt graphify-out/graph.json '
              ($committed[0].nodes | map(.id) | sort) as $old_nodes |
              ($rebuilt[0].nodes | map(.id) | sort) as $new_nodes |
              ($committed[0].links | map({source, target, relation}) | unique_by([.source, .target, .relation])) as $old_edges |
              ($rebuilt[0].links | map({source, target, relation}) | unique_by([.source, .target, .relation])) as $new_edges |
              ($new_nodes - $old_nodes) as $added_nodes |
              ($old_nodes - $new_nodes) as $removed_nodes |
              ($new_edges - $old_edges) as $added_edges |
              ($old_edges - $new_edges) as $removed_edges |
              {
                added_node_count: ($added_nodes | length),
                added_node_ids: $added_nodes[:50],
                removed_node_count: ($removed_nodes | length),
                removed_node_ids: $removed_nodes[:50],
                added_edge_count: ($added_edges | length),
                added_edge_endpoints: $added_edges[:50],
                removed_edge_count: ($removed_edges | length),
                removed_edge_endpoints: $removed_edges[:50]
              }'
            exit 1
          fi

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  deploy-server:
    # Deploys the community server after its tests pass on master. Skipped until the repository
    # secret CLOUDFLARE_API_TOKEN exists (see server/README.md).
    needs: server
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          GITHUB_APP_ID: ${{ secrets.LEVELS_APP_ID }}
          GITHUB_APP_KEY: ${{ secrets.LEVELS_APP_KEY }}
          GITHUB_INSTALLATION_ID: ${{ secrets.LEVELS_APP_INSTALLATION_ID }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.LEVELS_WEBHOOK_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN; skipping the deploy."; exit 0; fi
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          scripts/deploy.sh
