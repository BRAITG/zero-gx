name = "zero-gx"
main = "src/worker.ts"
compatibility_date = "2026-10-18"
# Served only at the custom domain (Cloudflare creates its DNS record and certificate); no workers.dev URL.
routes = [{ pattern = "zerogx.braitg.dev", custom_domain = true }]
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "zero-gx"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder: setup replaces it with the created database's id

[[r2_buckets]]
binding = "DEMOS"
bucket_name = "zero-gx-demos"

[triggers]
crons = ["*/10 * * * *"]

# Limits the unauthenticated /nonce and /session per client IP. The namespace_id is any number that is unique in the
# Cloudflare account (the placeholder is fine unless another Worker already uses it); period must be 10 or 60.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[vars]
LEVELS_REPO = "BRAITG/zero-gx-levels"
ALLOW_TEST_VERIFIER = "0"
