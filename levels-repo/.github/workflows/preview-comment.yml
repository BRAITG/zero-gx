name: Preview comment

# Publishes what "Check submission" rendered: commits the level's sketch to the PR branch, stores the render on the `previews`
# branch (one image per PR) and keeps one comment on the PR with the image and a viewer link. The comment and image stay after
# the PR closes.
#
# This runs in the trusted context of the default branch with a write token, so it never checks out or runs PR code, and it
# treats the artifact as untrusted: a PR runs its own copy of check.yml and can upload anything. It verifies number and head_sha
# against the workflow_run payload and the PR, validates names and sizes, and only handles PRs from this repository.
#
# It does not look at the conclusion of the checked run: `check` fails until a moderator sets the difficulty label, and the
# preview is what they set it from. A run without the artifact (no level added, or the guard refused) is skipped.
#
# A commit made with GITHUB_TOKEN does not start other workflows, so the sketch commit does not rerun "Check submission" on its own.
# The next label event does, on the new head, and that run keeps the comment up to date.

on:
  workflow_run:
    workflows: ["Check submission"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

# One run per PR branch at a time, in order. Runs for different PRs still meet on `previews`, which setPreview retries.
concurrency:
  group: preview-comment-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: preview-${{ github.event.workflow_run.head_sha }}  # no match is not an error, unlike `name`
          merge-multiple: true
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const raw = 'https://raw.githubusercontent.com/BRAITG/zero-gx-levels';
            const marker = '<!-- zero-gx-preview -->';

            // One commit on `previews` that leaves `<number>/<sha>.png` as the only file of the PR. Creates the orphan branch
            // when missing and starts over when another run moved the branch meanwhile.
            async function setPreview(number, sha, png) {
              const path = `${number}/${sha}.png`;
              for (let attempt = 1; ; attempt++) {
                try {
                  const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/previews'}).catch(e => { if (e.status !== 404) throw e; });
                  const parent = ref?.data.object.sha;
                  let base, entries = [];
                  if (parent) {
                    const {data: t} = await github.rest.git.getTree({owner, repo, tree_sha: parent, recursive: 'true'});
                    base = t.sha;
                    entries = t.tree.filter(e => e.type === 'blob' && e.path.startsWith(`${number}/`) && e.path !== path)
                      .map(e => ({path: e.path, mode: '100644', type: 'blob', sha: null}));
                  }
                  const {data: blob} = await github.rest.git.createBlob({owner, repo, content: png.toString('base64'), encoding: 'base64'});
                  entries.push({path, mode: '100644', type: 'blob', sha: blob.sha});
                  const {data: tree} = await github.rest.git.createTree({owner, repo, base_tree: base, tree: entries});
                  if (tree.sha === base) return;
                  const {data: commit} = await github.rest.git.createCommit({owner, repo, message: `Preview of #${number} at ${sha}`, tree: tree.sha, parents: parent ? [parent] : []});
                  if (parent) await github.rest.git.updateRef({owner, repo, ref: 'heads/previews', sha: commit.sha});
                  else await github.rest.git.createRef({owner, repo, ref: 'refs/heads/previews', sha: commit.sha});
                  return;
                } catch (e) {
                  if (e.status !== 422 || attempt === 3) throw e;
                }
              }
            }

            // The artifact is untrusted: only regular files, capped in size. A symlink would read a file off the runner.
            function artifactFile(name, max) {
              const path = `artifact/${name}`;
              if (!fs.existsSync(path)) return null;
              const st = fs.lstatSync(path);
              if (!st.isFile() || st.size > max) throw new Error(`${name} is not a regular file of at most ${max} bytes`);
              return fs.readFileSync(path);
            }

            const prJson = artifactFile('pr.json', 1024);
            if (!prJson) {
              core.notice('No preview artifact for this run.');
              return;
            }
            const {number, head_sha: sha, level, version} = JSON.parse(prJson);
            if (sha !== context.payload.workflow_run.head_sha || !/^lvl_[a-z0-9]{10}$/.test(level) ||
                !Number.isSafeInteger(number) || number < 1 || !Number.isSafeInteger(version) || version < 1) {
              throw new Error('pr.json does not match this run.');
            }
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (pr.state !== 'open' || pr.head.sha !== sha || pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.notice('The pull request has moved on; skipping.');
              return;
            }

            const sketch = artifactFile('sketch.json', 2048);
            const png = artifactFile('preview.png', 5 * 1024 * 1024);
            if (!sketch || !png || !png.subarray(0, 8).equals(Buffer.from('89504e470d0a1a0a', 'hex'))) {
              throw new Error('The preview artifact is incomplete or not a PNG.');
            }
            JSON.parse(sketch);

            const sketchPath = `levels/${level}/v${version}.sketch.json`;
            const current = await github.rest.repos.getContent({owner, repo, path: sketchPath, ref: sha}).catch(e => { if (e.status !== 404) throw e; });
            if (!current || !Buffer.from(current.data.content, 'base64').equals(sketch)) {
              const {data: head} = await github.rest.git.getCommit({owner, repo, commit_sha: sha});
              const {data: blob} = await github.rest.git.createBlob({owner, repo, content: sketch.toString('base64'), encoding: 'base64'});
              const {data: tree} = await github.rest.git.createTree({owner, repo, base_tree: head.tree.sha, tree: [{path: sketchPath, mode: '100644', type: 'blob', sha: blob.sha}]});
              const {data: commit} = await github.rest.git.createCommit({owner, repo, message: 'Add level sketch', tree: tree.sha, parents: [sha]});
              try {
                await github.rest.git.updateRef({owner, repo, ref: `heads/${pr.head.ref}`, sha: commit.sha});
              } catch (e) {
                if (e.status !== 422) throw e;
                core.notice('The pull request branch has moved on; skipping.');
                return;
              }
            }

            await setPreview(number, sha, png);

            const levelUrl = `${raw}/${sha}/levels/${level}/v${version}.json`;
            const demoUrl = `${raw}/${sha}/proof/${level}/v${version}.demo.gz`;
            const body = `${marker}\n**Preview of \`${level}\` v${version}** at \`${sha}\`\n\n` +
              `![Level render](${raw}/previews/${number}/${sha}.png)\n\n` +
              `[Watch the proof run in the browser](https://braitg.dev/zero-gx/viewer/?level=${levelUrl}&demo=${demoUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: number});
            const mine = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number: number, body});
