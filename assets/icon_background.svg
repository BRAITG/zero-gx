<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="space" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#16244a"/>
      <stop offset="1" stop-color="#03050c"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7fc9e8"/>
      <stop offset="0.55" stop-color="#2f6f8f"/>
      <stop offset="1" stop-color="#132f42"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.6" stop-color="#3aa0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb4ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bcd8ff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#space)"/>
  <!-- stars -->
  <g fill="#dfe9ff">
    <circle cx="70" cy="90" r="3" opacity="0.8"/>
    <circle cx="400" cy="440" r="2.5" opacity="0.7"/>
    <circle cx="455" cy="200" r="2" opacity="0.6"/>
    <circle cx="60" cy="300" r="2" opacity="0.6"/>
    <circle cx="140" cy="450" r="2.5" opacity="0.7"/>
    <circle cx="300" cy="40" r="2" opacity="0.5"/>
    <circle cx="470" cy="420" r="3" opacity="0.8"/>
  </g>
</svg>
