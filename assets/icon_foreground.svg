<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="space" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#16244a"/>
      <stop offset="1" stop-color="#03050c"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7fc9e8"/>
      <stop offset="0.55" stop-color="#2f6f8f"/>
      <stop offset="1" stop-color="#132f42"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.6" stop-color="#3aa0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb4ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bcd8ff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(256 256) scale(0.66) translate(-256 -256)">
  
  
  <!-- planet with its pull -->
  <circle cx="230" cy="290" r="140" fill="url(#halo)"/>
  <circle cx="230" cy="290" r="82" fill="url(#planet)"/>
  <circle cx="230" cy="290" r="86" fill="none" stroke="#9fd8ff" stroke-width="4" opacity="0.6"/>
  <!-- slingshot trail curving around the planet -->
  <path d="M 40 470 C 120 420, 110 190, 230 160 S 300 150, 318 146" fill="none" stroke="url(#trail)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <!-- goal ring -->
  <circle cx="420" cy="118" r="46" fill="none" stroke="#66ff99" stroke-width="10" filter="url(#glow)"/>
  <circle cx="420" cy="118" r="14" fill="#66ff99"/>
  <!-- ship, heading along the end of the trail -->
  <g transform="translate(330 140) rotate(-12)" filter="url(#glow)">
    <path d="M 42 0 L -30 26 L -15 0 L -30 -26 Z" fill="#e8f1ff" stroke="#7fb4ff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M -18 10 L -58 0 L -18 -10 Z" fill="#ff8a3c"/>
    <circle cx="10" cy="0" r="6" fill="#3aa0ff"/>
  </g>

  </g>
</svg>
